services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: flight
      MYSQL_USER: flight
      MYSQL_PASSWORD: flight
    ports:
      - "3306:3306"
    volumes:
      - flight_mysql_data:/var/lib/mysql
      - ./apps/server/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flight_mysql_data:
